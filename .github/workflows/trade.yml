name: PolySimulator Quant Bot

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polysim-trading-cycle
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trading cycle
        env:
          POLYSIM_API_KEY: ${{ secrets.POLYSIM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: python -m bot.orchestrator

      - name: Commit updated state and dashboard data
        run: |
          if git diff --quiet -- docs/dashboard_data.json; then
            echo "Dashboard unchanged (idle 5-min check); skipping commit."
          else
            git config user.name "polysim-bot"
            git config user.email "polysim-bot@users.noreply.github.com"
            git add -f data/state.db docs/dashboard_data.json
            if git diff --cached --quiet; then
              echo "No changes to commit."
            else
              git commit -m "chore: update state and dashboard [skip ci]"
              git push
            fi
          fi
